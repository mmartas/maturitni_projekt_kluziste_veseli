<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Panel</title>

    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/admin.css">

    <script src="https://kit.fontawesome.com/9e0a62895a.js" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <main>
        <div class="admin_main_container">
            <section id="adminMenuWrapper" class="box_glass_effect">
                <section id="admin_menu">
                    <div class="admin_menu_inside">
                        <ul class="text">
                            <li><a id="adminMenuArrow" class="box_glass_effect_red" href="#"><i class="fa-solid fa-angles-right" ></i></a></li>
                            <li>
                                <a href="#" id="dashboardIcon"><i class="fa-solid fa-chart-line"></i></a>
                                <a href="#">Přehled</a>
                            </li>
                            <li>
                                <a href="#" id="eventsIcon"><i class="fa-regular fa-calendar"></i></a>
                                <a href="#">Události</a>
                            </li>
                            <li>
                                <a href="#" id="reservationsIcon"><i class="fa-regular fa-calendar-check"></i></a>
                                <a href="#">Rezervace</a>
                            </li>
                            <li>
                                <a href="#" id="inboxIcon"><i class="fa-regular fa-envelope"></i></a>
                                <a href="#">Zprávy</a>
                            </li>
                            <li>
                                <a href="#"><i class="fa-solid fa-user"></i></a>
                                <a href="#">Administrátor</a>
                            </li>
                        </ul>
                    </div>
                </section>
            </section>
            

            <section id="admin_table" class="box_glass_effect">
                <div class="wrapper">
                    <a id="inboxRefreshArrow" class="box_glass_effect_red" href="#"><i class="fa-solid fa-arrow-rotate-left" ></i></a>
                    <section id="dashboard" class="content active">
                        <div class="segment">
                            <p>Rozpis vyplněný do: <span id="endEventsDate"></span></p>
                        </div>
                        <!-- <div class="segment">
                            <p>Počet všech bloků k pronájmu: <span id="countAllRentDates"></span></p>
                            <p>Počet volných bloků k pronájmu: <span id="countFreeRentDates"></span></p>
                            <p>Počet obsazených bloků k pronájmu: <span id="countRentedDates"></span></p>
                        </div> -->
                    </section>
                    <section id="events" class="content">
                        
                    </section>
                    <section id="reservations" class="content">
                        
                    </section>
                    <section id="inbox" class="content">
                        
                        <div id="messagesContainer" class="segment">
                            
                        </div>
                    </section>
                </div>
            </section>
        </div>
    </main>
    <script src="../js/function.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
