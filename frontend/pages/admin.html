<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Panel</title>

    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/admin.css">

    <script src="https://kit.fontawesome.com/9e0a62895a.js" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <main>
        <div class="admin_main_container">
            <section id="adminMenuWrapper" class="box_glass_effect">
                <section class="admin_menu">
                    <div class="admin_menu_inside">
                        <ul class="text">
                            <li><a href="#"><i class="fa-solid fa-angles-right" id="menuArrow"></i></a></li>
                            <li>
                                <a href="#"><i class="fa-solid fa-chart-line"></i></a>
                                <a href="#">Přehled</a>
                            </li>
                            <li>
                                <a href="#"><i class="fa-regular fa-calendar"></i></a>
                                <a href="#">Události</a>
                            </li>
                            <li>
                                <a href="#"><i class="fa-regular fa-calendar-check"></i></a>
                                <a href="#">Rezervace</a>
                            </li>
                            <li>
                                <a href="#"><i class="fa-regular fa-envelope"></i></a>
                                <a href="#">Zprávy</a>
                            </li>
                            <li>
                                <a href="#"><i class="fa-solid fa-user"></i></a>
                                <a href="#">Administrátor</a>
                            </li>
                        </ul>
                    </div>
                </section>
            </section>
            

            <section class="admin_table box_glass_effect">
                <div class="wrapper">
                    <section id="dashboard" class="content">
                        
                    </section>
                    <section id="events" class="content">
                        
                    </section>
                    <section id="rezervations" class="content">
                        
                    </section>
                    <section id="inbox" class="content">
                        
                    </section>
                </div>
            </section>
        </div>
    </main>
    
    <script src="../js/admin.js"></script>
</body>
</html>
