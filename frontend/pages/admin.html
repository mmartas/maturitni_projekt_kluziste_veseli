<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Panel</title>

    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/calendar.css">
    <link rel="stylesheet" href="../css/admin.css">

    <script src="https://kit.fontawesome.com/9e0a62895a.js" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="shortcut icon" href="../images/favicon-admin.png" type="image/x-icon">

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/locales-all.global.min.js"></script>

</head>
<body>
    <main>
        <div class="admin_main_container">
            <section id="adminMenuWrapper" class="box_glass_effect">
                <section id="adminMenu">
                    <div class="admin_menu_inside">
                        <ul class="text">
                            <li>
                                <a id="adminMenuArrow" class="box_glass_effect_red icon_arrow_menu_refresh" href="#">
                                    <i class="fa-solid fa-angles-right" ></i>
                                </a>
                            </li>
                            <li>
                                <a href="#" id="dashboardIcon" class="active menu_icons">
                                    <i class="fa-solid fa-chart-line"></i>
                                </a>
                                <a href="#">Přehled</a>
                            </li>
                            <li>
                                <a href="#" id="eventsIcon" class="menu_icons">
                                    <i class="fa-regular fa-calendar"></i>
                                </a>
                                <a href="#">Události</a>
                            </li>
                            <li>
                                <a href="#" id="reservationsIcon" class="menu_icons">
                                    <i class="fa-regular fa-calendar-check"></i>
                                </a>
                                <a href="#">Rezervace</a>
                            </li>
                            <li>
                                <a href="#" id="inboxIcon" class="menu_icons">
                                    <span id="unreadMessagesIcon"></span>
                                    <i class="fa-regular fa-envelope"></i>
                                </a>
                                <a href="#">Zprávy</a>
                            </li>
                            <li>
                                <a href="#" id="userIcon" class="menu_icons">
                                    <i class="fa-solid fa-user"></i>
                                </a>
                                <a href="#">Administrátor</a>
                            </li>
                        </ul>
                    </div>
                </section>
            </section>
            

            <section id="adminContent" class="box_glass_effect">
                <div class="wrapper">
                    <a id="inboxRefreshArrow" class="box_glass_effect_red icon_arrow_menu_refresh" href="#">
                        <i class="fa-solid fa-arrow-rotate-left" ></i>
                    </a>
                    <section id="dashboard" class="content active">
                        <div class="segment">
                            <p>Rozpis vyplněný do: <span id="endEventsDate"></span></p>
                        </div>
                        <div class="segment">
                            <p>Počet všech bloků k pronájmu: <span id="countAllRentDates"></span></p>
                            <p>Počet volných bloků k pronájmu: <span id="countFreeRentDates"></span></p>
                            <p>Počet obsazených bloků k pronájmu: <span id="countRentedDates"></span></p>
                        </div>
                    </section>










                    <section id="events" class="content">
                        <div class="events_form_container">
                            <h2 class="title">Vkládání událostí do kalendáře</h2>
                            <form id="insertEventsForm" class="text">
                                <div class="form_group">
                                    <label>Událost: </label>
                                    <select id="eventTitle" required>
                                        <option value="public">Veřejné bruslení</option>
                                        <option value="rent">Možnost pronájemu</option>
                                        <option value="maintenance">Úklid ledu</option>
                                        <option value="school">Školní akce</option>
                                        <option value="booked">Obsazeno</option>
                                    </select>
                                </div>
                                <div class="form_group">
                                    <label>Začátek:</label>
                                    <input type="datetime-local" id="eventStart" required>
                                </div>
                                <div class="form_group">
                                    <label>Konec:</label>
                                    <input type="datetime-local" id="eventEnd" required>
                                </div>
                                <button type="submit">Přidat událost</button>
                            </form>
                        </div>

                        <div id="calendar" class="box_glass_effect"></div>
                    </section>












                    <section id="reservations" class="content">
                        
                    </section>
                    <section id="inbox" class="content">
                        
                        <div id="messagesContainer" class="segment">
                            
                        </div>
                    </section>
                </div>
            </section>
        </div>
    </main>
    <script src="../js/function.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
