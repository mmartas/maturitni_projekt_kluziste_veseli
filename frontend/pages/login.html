<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení | Admin panel</title>
    <link rel="shortcut icon" href="../images/favicon-admin.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/admin.css">

    <script src="https://kit.fontawesome.com/9e0a62895a.js" crossorigin="anonymous"></script>
</head>
<body>
    <main>
        <div class="signincontainer box_glass_effect">
            <h2 class="title">Přihlásit se</h2>
            <form action="" id="signInForm">
                <label for="" class="text">
                    E-mail:
                    <input id="adminUsername" type="email" required>
                </label>
                <label for="" class="text">
                    Heslo:
                    <div class="password-container">
                        <input id="adminPassword" type="password" required>
                        <i class="fa-solid fa-eye toggle-password" data-target="adminPassword"></i>
                    </div>
                    
                </label>
                <button type="submit" class="box_glass_effect_blue" id="signInButton">Přihlásit</button>
            </form>
        </div>
    </main>
    <script src="../js/login.js"></script>
</body>
</html>
